<style>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    const isInStandaloneMode = ('standalone' in window.navigator) && (window.navigator.standalone);
    if (isIos && !isInStandaloneMode) {
        document.getElementById('ios-tip').style.display = 'block';
    }
});

function say(t){
    try{
        speechSynthesis.cancel();
        const cleanText = t.replace(/<[^>]*>?/gm, '');
        const u=new SpeechSynthesisUtterance(cleanText);
        u.lang="pl-PL";
        speechSynthesis.speak(u);
    }catch(e){}
}

const lessons = [
    {

                <p><b>2. Elementy nieożywione:</b> to np. woda, powietrze, skały, chmury czy Słońce. One nie oddychają ani nie rosną (chociaż wiatr może wprawić wodę w ruch, to sama nie potrafi ożyć).</p>

        `

    {

        content: `

let currentLesson = 0;

function renderLesson() {
    const l = lessons[currentLesson];
    let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
            <p class="mu" style="margin:0;">Moduł ${currentLesson + 1} z ${lessons.length}</p>
            <button class="s" onclick="say('${l.speech}')">🔊 Przeczytaj tę lekcję</button>
        </div>
        <h2>${l.title}</h2>
        <div style="line-height: 1.8;">${l.content}</div>
        <div class="nav-buttons">
    `;

    if (currentLesson > 0) {
        html += `<button class="b" onclick="changeLesson(-1)">⬅️ Poprzedni temat</button>`;
    } else {
        html += `<div></div>`;
    }

    if (currentLesson < lessons.length - 1) {
        html += `<button class="b go" style="margin-top:0;" onclick="changeLesson(1)">Następny temat ➡️</button>`;
    } else {
        html += `<button class="b go" style="margin-top:0;" onclick="currentLesson=0; renderLesson();">Rozpocznij od nowa 🔄</button>`;
    }

    html += `</div>`;
    $("app").innerHTML = html;
    window.scrollTo(0,0);
}

function changeLesson(dir) {
    currentLesson += dir;
    if (currentLesson < 0) currentLesson = 0;
    if (currentLesson >= lessons.length) currentLesson = lessons.length - 1;
    renderLesson();
}

let fontSz = 20;
function fs(d){
    fontSz = Math.min(30, Math.max(16, fontSz + d));
    document.documentElement.style.setProperty("--fs", fontSz + "px");
}

const $=id=>document.getElementById(id);
renderLesson();
</script></body></html>
